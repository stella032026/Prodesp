<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Portal PRODESP</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="login.css">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<script src="https://kit.fontawesome.com/4ad4d5d7d2.js" crossorigin="anonymous"></script>

</head>

<body>

<div class="container">

<div class="login-box">

<div class="logo">

<img src="img/logo-prodesp.png" alt="Logo PRODESP">

</div>

<h1>Portal de Editais</h1>

<p>

Entre com sua conta para acessar os serviços.

</p>

<form id="formLogin">

<div class="campo">

<label>E-mail</label>

<input

type="email"

id="email"

placeholder="Digite seu e-mail"

required>

</div>

<div class="campo">

<label>Senha</label>

<div class="senha">

<input

type="password"

id="senha"

placeholder="Digite sua senha"

required>

<i

class="fa-solid fa-eye"

id="mostrarSenha">

</i>

</div>

</div>

<div class="opcoes">

<label>

<input type="checkbox">

Lembrar de mim

</label>

<a href="#">

Esqueci minha senha

</a>

</div>

<button

type="submit"

class="btn-login">

Entrar

</button>

<hr>

<p>

Ainda não possui cadastro?

</p>

<a

href="#"

class="btn-cadastro">

Criar Conta

</a>

</form>

</div>

</div>

<script src="js/login.js"></script>

</body>

</html>
